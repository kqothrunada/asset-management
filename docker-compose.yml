services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "dev12345!"
    ports: ["14333:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.22
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports: ["5601:5601"]
    depends_on: [elasticsearch]

  api:
    build:
      context: .
      dockerfile: src/AssetManagement.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Server=sqlserver,14333;Database=AssetDb;User Id=sa;Password=dev12345!;TrustServerCertificate=True"
      Jwt__Key: "dev-only-key-minimal-32-karakter-ganti-ya!!"
      Jwt__Issuer: "asset-api"
      Jwt__Audience: "asset-web"
      Elastic__Uri: "http://elasticsearch:9200"
      DataProtection__KeyPath: "/keys"
      Integration__BaseUrl: "http://localhost:8080"
    volumes: [dpkeys:/keys]
    ports: ["5000:8080"]
    depends_on:
      sqlserver: { condition: service_healthy }
      elasticsearch: { condition: service_started }

  web:
    build: ./web
    ports: ["3000:80"]
    depends_on: [api]

volumes:
  sqldata:
  esdata:
  dpkeys: